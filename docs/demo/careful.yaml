# A developer profile where every shell command needs sign-off.
# The agent can read and edit files freely, but waits for approval before
# running anything. Used by the control-plane demo.

profile: careful
description: "Developer profile with approval required for shell commands"

shell:
  mode: unrestricted

file_write:
  mode: full

database:
  mode: readonly

approval:
  mode: granular
  required_tools:
    - bash

shell_timeout: 300
